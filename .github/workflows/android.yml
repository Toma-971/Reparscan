name: Application Android (APK)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run android
      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ReparScan.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ReparScan-apk
          path: ReparScan.apk
      - name: Publier l'APK dans la release « apk »
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk ReparScan.apk --target "$GITHUB_SHA" --title "Répar'Scan pour Android" --notes "Dernière version, construite depuis main. Télécharger ReparScan.apk sur le téléphone puis l'ouvrir pour l'installer."
